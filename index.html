<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 (Gamza) - 포슬포슬 따뜻한 우리 동네 중고거래</title>
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 공통 디자인 시스템 및 화면별 스타일시트 -->
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/list.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <link rel="stylesheet" href="css/write.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- [화면 1] 상품 목록 컨테이너 -->
  <div id="app-list-root"></div>

  <!-- [화면 2] 상세 팝업(모달) 컨테이너 -->
  <div id="app-detail-root"></div>

  <!-- [화면 3] 글쓰기 화면 컨테이너 -->
  <div id="app-write-root" class="hidden"></div>

  <!-- [화면 4] 로그인 / 회원가입 모달 컨테이너 -->
  <div id="app-auth-root" class="hidden"></div>

  <!-- 푸터 -->
  <footer style="border-top: 1px solid var(--border-color); background-color: var(--bg-subtle); padding: 28px 0; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
    <div class="container">
      <p style="font-weight: 700; color: var(--text-sub); margin-bottom: 4px;">🥔 감자 (Gamza) 중고거래 웹 서비스</p>
      <p>이웃과 나누는 포슬포슬하고 따뜻한 직거래 장터</p>
    </div>
  </footer>

  <!-- Supabase JS SDK 및 화면별 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/list.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/write.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
